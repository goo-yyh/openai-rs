name: Live Providers

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider to run
        required: true
        default: all
        type: choice
        options:
          - all
          - openai
          - kimi
          - deepseek
          - zhipu
          - minimax
          - zenmux
      tier:
        description: Live test tier
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - extended
          - slow
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

jobs:
  openai:
    if: ${{ github.event_name == 'schedule' || inputs.provider == 'all' || inputs.provider == 'openai' }}
    name: Live OpenAI (${{ github.event_name == 'schedule' && 'smoke' || inputs.tier }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@v2

      - name: Run live provider tests
        env:
          OPENAI_RS_LIVE_TIER: ${{ github.event_name == 'schedule' && 'smoke' || inputs.tier }}
          OPENAI_RS_ALLOW_LIVE_API_CALLS: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_CHAT_MODEL: ${{ vars.OPENAI_CHAT_MODEL }}
          OPENAI_RESPONSES_MODEL: ${{ vars.OPENAI_RESPONSES_MODEL }}
        run: cargo test --all-features --test provider_live openai -- --nocapture --test-threads=1

  kimi:
    if: ${{ github.event_name != 'schedule' && (inputs.provider == 'all' || inputs.provider == 'kimi') }}
    name: Live KIMI (${{ inputs.tier }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@v2

      - name: Run live provider tests
        env:
          OPENAI_RS_LIVE_TIER: ${{ inputs.tier }}
          OPENAI_RS_ALLOW_LIVE_API_CALLS: "1"
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_BASE_URL: ${{ vars.KIMI_BASE_URL }}
          KIMI_CHAT_MODEL: ${{ vars.KIMI_CHAT_MODEL }}
          KIMI_RESPONSES_MODEL: ${{ vars.KIMI_RESPONSES_MODEL }}
        run: cargo test --all-features --test provider_live kimi -- --nocapture --test-threads=1

  deepseek:
    if: ${{ github.event_name != 'schedule' && (inputs.provider == 'all' || inputs.provider == 'deepseek') }}
    name: Live DeepSeek (${{ inputs.tier }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@v2

      - name: Run live provider tests
        env:
          OPENAI_RS_LIVE_TIER: ${{ inputs.tier }}
          OPENAI_RS_ALLOW_LIVE_API_CALLS: "1"
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_CHAT_MODEL: ${{ vars.DEEPSEEK_CHAT_MODEL }}
          DEEPSEEK_RESPONSES_MODEL: ${{ vars.DEEPSEEK_RESPONSES_MODEL }}
        run: cargo test --all-features --test provider_live deepseek -- --nocapture --test-threads=1

  zhipu:
    if: ${{ github.event_name != 'schedule' && (inputs.provider == 'all' || inputs.provider == 'zhipu') }}
    name: Live Zhipu (${{ inputs.tier }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@v2

      - name: Run live provider tests
        env:
          OPENAI_RS_LIVE_TIER: ${{ inputs.tier }}
          OPENAI_RS_ALLOW_LIVE_API_CALLS: "1"
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          ZHIPU_CHAT_MODEL: ${{ vars.ZHIPU_CHAT_MODEL }}
          ZHIPU_RESPONSES_MODEL: ${{ vars.ZHIPU_RESPONSES_MODEL }}
        run: cargo test --all-features --test provider_live zhipu -- --nocapture --test-threads=1

  minimax:
    if: ${{ github.event_name != 'schedule' && (inputs.provider == 'all' || inputs.provider == 'minimax') }}
    name: Live MiniMax (${{ inputs.tier }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@v2

      - name: Run live provider tests
        env:
          OPENAI_RS_LIVE_TIER: ${{ inputs.tier }}
          OPENAI_RS_ALLOW_LIVE_API_CALLS: "1"
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_CHAT_MODEL: ${{ vars.MINIMAX_CHAT_MODEL }}
          MINIMAX_RESPONSES_MODEL: ${{ vars.MINIMAX_RESPONSES_MODEL }}
        run: cargo test --all-features --test provider_live minimax -- --nocapture --test-threads=1

  zenmux:
    if: ${{ github.event_name != 'schedule' && (inputs.provider == 'all' || inputs.provider == 'zenmux') }}
